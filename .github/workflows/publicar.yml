# Publica o painel Selic e crédito, atualizado todo dia.
#
# O pipeline inteiro, em ordem:
#   1. coletor.py    baixa as 5 séries do SGS e o Focus (APIs do Banco Central)
#   2. analise.py    mensaliza, calcula e gera painel.html
#   3. comentario.py chama o modelo e escreve a leitura do dia
#   4. testes.py     verifica propriedades da leitura — PORTÃO: se falhar, nada publica
#   5. montar.py     junta painel + leitura em public/index.html
#   6. deploy        GitHub Pages
#
# O teste vem antes do build de propósito. Uma leitura que invente número,
# afirme causa ou recomende ação quebra o processo e não chega ao ar.

name: Publicar painel

on:
  push:
    branches: [main]
  schedule:
    # 11:30 UTC = 08:30 em Brasília, dias úteis.
    # As séries do BCB saem de manhã; rodar cedo pega o dado do dia.
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests anthropic

      - name: Coletar as séries do Banco Central
        run: python coletor.py

      - name: Calcular e gerar o painel
        run: python analise.py

      - name: Escrever a leitura do dia com o modelo
        # A chave nunca está no repositório. Vem de
        # Settings → Secrets and variables → Actions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python comentario.py

      - name: Testar as propriedades da leitura
        # O portão. Saída de modelo não se testa com diff — ela nunca se repete.
        # O que se testa são propriedades: número inventado, causalidade,
        # recomendação, unidade errada, markdown.
        run: python testes.py

      - name: Montar a página publicada
        run: python montar.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
